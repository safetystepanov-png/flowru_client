workflows:
  ios-signed-ipa:
    name: Flowru Client iOS Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple API

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ru.flowru.client
        APP_NAME: Flowru Client
        FLOWRU_API_URL: https://mapi.flowru.ru/api/v1

    scripts:
      - name: Show project info
        script: |
          echo "Bundle ID: $BUNDLE_ID"
          echo "Project: flowru_client"
          flutter --version

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Fetch iOS App Store signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates

      - name: Apply iOS signing settings
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --dart-define=FLOWRU_API_URL=$FLOWRU_API_URL

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - safetystepanov@gmail.com
        notify:
          success: true
          failure: true
