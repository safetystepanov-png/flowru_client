workflows:
  ios-testflight:
    name: Flowru Client iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple API

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ru.flowru.client
      vars:
        BUNDLE_ID: ru.flowru.client
        XCODE_PROJECT: ios/Runner.xcodeproj
        XCODE_SCHEME: Runner

    scripts:
      - name: Show project info
        script: |
          echo "Bundle ID: $BUNDLE_ID"
          echo "Project: $XCODE_PROJECT"
          echo "Scheme: $XCODE_SCHEME"
          flutter --version
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Get Flutter dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Apply iOS signing settings
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=FLOWRU_API_URL=https://mapi.flowru.ru/api/v1

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal