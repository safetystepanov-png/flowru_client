workflows:
  ios-signed-ipa:
    name: Flowru Client iOS Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple API

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: ru.flowru.client

      vars:
        BUNDLE_ID: ru.flowru.client

    scripts:
      - name: Show project info
        script: |
          echo "Bundle ID: $BUNDLE_ID"
          flutter --version
          xcodebuild -version

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Fetch iOS App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Apply iOS signing settings
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - safetystepanov@gmail.com
        notify:
          success: true
          failure: true
