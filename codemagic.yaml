workflows:
  ios-signed-ipa:
    name: Flowru Client iOS Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple API

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ru.flowru.client"
        XCODE_PROJECT: "ios/Runner.xcodeproj"
        XCODE_SCHEME: "Runner"
        APP_NAME: "Flowru Client"

    scripts:
      - name: Show project info
        script: |
          echo "Bundle ID: $BUNDLE_ID"
          echo "Project: $XCODE_PROJECT"
          echo "Scheme: $XCODE_SCHEME"
          flutter --version

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch iOS App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply iOS signing settings
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      email:
        recipients:
          - safetystepanov@gmail.com
        notify:
          success: true
          failure: true
